<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 세계일주 — 43일의 지구 한 바퀴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#070b14; --panel:rgba(13,18,30,.9); --ink:#e8e6dd; --muted:#8b93a3;
    --teal:#37c8a8; --gold:#e0b45a; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  #globe{position:absolute; inset:0}
  header{
    position:absolute; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:20px 24px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(7,11,20,.85), transparent);
  }
  header h1{font-family:'Gowun Batang',serif; font-size:1.5rem; letter-spacing:.02em}
  header .sub{color:var(--muted); font-size:.85rem}
  header .legend{margin-left:auto; font-size:.78rem; color:var(--muted); display:flex; gap:14px}
  .legend i{display:inline-block; width:18px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
  .legend .f i{background:var(--teal)} .legend .g i{background:var(--gold)}

  /* 좌측 여정 목록 */
  #panel{
    position:absolute; z-index:50; top:76px; bottom:16px; left:16px; width:280px;
    background:var(--panel); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #panel h2{font-size:.8rem; letter-spacing:.14em; color:var(--muted); font-weight:700; padding:14px 16px 8px}
  #stops{overflow-y:auto; flex:1; padding:0 8px 12px; scrollbar-width:thin}
  .stop{
    display:flex; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; transition:background .15s;
  }
  .stop:hover{background:rgba(255,255,255,.05)}
  .stop.active{background:rgba(55,200,168,.12); border-color:rgba(55,200,168,.35)}
  .stop .n{
    flex:0 0 26px; height:26px; border-radius:50%; background:rgba(55,200,168,.15);
    color:var(--teal); font-size:.75rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:2px;
  }
  .stop .d{font-size:.72rem; color:var(--gold); font-variant-numeric:tabular-nums; letter-spacing:.04em}
  .stop .c{font-size:.92rem; font-weight:700}
  .stop .m{font-size:.74rem; color:var(--muted); line-height:1.5}

  /* 우측 상세 드로어 */
  #drawer{
    position:absolute; z-index:60; top:76px; bottom:16px; right:16px; width:360px;
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateX(calc(100% + 24px)); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  #drawer.show{transform:translateX(0)}
  #drawer .head{padding:18px 20px 12px; border-bottom:1px solid var(--line); position:relative}
  #drawer .head .d{font-size:.75rem; color:var(--gold); letter-spacing:.06em; font-variant-numeric:tabular-nums}
  #drawer .head h3{font-family:'Gowun Batang',serif; font-size:1.4rem; margin:.1em 0 .25em}
  #drawer .head .via{font-size:.78rem; color:var(--muted)}
  #drawer .body{overflow-y:auto; padding:14px 20px 20px; scrollbar-width:thin; flex:1}
  .sec{margin-bottom:16px}
  .sec .t{font-size:.75rem; letter-spacing:.12em; color:var(--muted); font-weight:700; margin-bottom:6px}
  .sec p{font-size:.86rem; line-height:1.7}
  .stay{
    background:rgba(55,200,168,.08); border:1px solid rgba(55,200,168,.25);
    border-radius:10px; padding:12px 14px;
  }
  .stay .nm{font-weight:700; font-size:.92rem; margin-bottom:2px}
  .stay .pr{color:var(--teal); font-weight:700; font-size:.88rem; font-variant-numeric:tabular-nums}
  .stay .nt{font-size:.78rem; color:var(--muted); margin-top:5px; line-height:1.6}
  .stay .links{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .stay .links a{
    font-size:.78rem; font-weight:700; text-decoration:none; color:var(--teal);
    background:rgba(55,200,168,.13); border:1px solid rgba(55,200,168,.3);
    padding:5px 11px; border-radius:99px;
  }
  .stay .links a:hover{background:rgba(55,200,168,.25)}
  .stay .links a.map{color:var(--gold); background:rgba(224,180,90,.1); border-color:rgba(224,180,90,.3)}
  .stay .links a.map:hover{background:rgba(224,180,90,.2)}
  .todo{list-style:none; padding:0}
  .todo li{
    font-size:.85rem; line-height:1.6; padding:5px 0 5px 20px; position:relative;
    border-bottom:1px dashed var(--line);
  }
  .todo li:last-child{border-bottom:none}
  .todo li::before{content:"›"; position:absolute; left:4px; color:var(--teal); font-weight:700}
  .tipbox{
    background:rgba(224,180,90,.08); border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0; padding:9px 12px; font-size:.8rem; line-height:1.65; color:var(--ink);
  }
  #drawerClose{
    position:absolute; top:12px; right:12px; background:rgba(255,255,255,.06); border:none;
    color:var(--muted); font-size:1rem; cursor:pointer; width:30px; height:30px; border-radius:50%;
  }
  #drawerClose:hover{color:var(--ink)}
  #drawerClose:focus-visible{outline:2px solid var(--teal)}
  .navrow{display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--line)}
  .navrow button{
    flex:1; background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--ink);
    font-family:inherit; font-size:.84rem; padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .navrow button:hover{background:rgba(55,200,168,.15)}
  .navrow button:disabled{opacity:.3; cursor:default}

  .gmarker{
    color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:11.5px; font-weight:500;
    text-shadow:0 1px 4px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9);
    transform:translate(-50%,-130%); white-space:nowrap; cursor:pointer;
    pointer-events:auto; user-select:none;
  }
  .gmarker:hover{color:#67e8c8}

  /* 모바일: 목록은 하단 가로 스크롤, 드로어는 바텀시트 */
  @media (max-width:820px){
    #panel{top:auto; left:8px; right:8px; bottom:8px; width:auto; height:150px}
    #stops{display:flex; overflow-x:auto; overflow-y:hidden; gap:8px; padding:0 10px 10px}
    .stop{flex:0 0 185px; flex-direction:column; gap:4px}
    .stop .n{display:none}
    #drawer{
      top:auto; left:8px; right:8px; bottom:166px; width:auto; max-height:58vh;
      transform:translateY(calc(100% + 260px));
    }
    #drawer.show{transform:translateY(0)}
    header{padding:12px 14px} header h1{font-size:1.1rem} header .legend{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .stop{transition:none} #drawer{transition:none} }
</style>
</head>

<header>

    </div>
    <div class="sec" id="secTip">
      <div class="t">💡 팁</div>
      <div class="tipbox" id="dTip"></div>

  </div>
  <div class="navrow">

const GROUND = new Set([4,5,10,11,12,17,18]);
const arcs = [];
for (let i=0; i<STOPS.length-1; i++){
  const a=STOPS[i], b=STOPS[i+1], ground=GROUND.has(i);
  arcs.push({
    startLat:a.lat, startLng:a.lng, endLat:b.lat, endLng:b.lng,
    color: ground ? ["#e0b45a","#e0b45a"] : ["#37c8a8","#67e8c8"],
    stroke: ground ? 0.55 : 0.75,
    alt: ground ? 0.03 : undefined,
    label: `${a.city} → ${b.city} · ${ground ? '🚗🚂' : '✈'} ${b.dur}`
  });
}

const world = Globe()(document.getElementById('globe'))
  .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-night.jpg')
  .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-topology.png')
  .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/night-sky.png')
  .atmosphereColor('#3a9d8a')
  .atmosphereAltitude(0.18)
  .arcsData(arcs)
  .arcColor('color')
  .arcStroke('stroke')
  .arcAltitude(d => d.alt ?? null)
  .arcDashLength(0.45)
  .arcDashGap(0.18)
  .arcDashAnimateTime(2600)
  .arcLabel('label')
  .arcsTransitionDuration(0)
  .pointsData(STOPS)
  .pointLat('lat').pointLng('lng')
  .pointColor(() => '#ffffff')
  .pointAltitude(0.012)
  .pointRadius(0.34)
  .htmlElementsData(STOPS.filter(s => s.n !== 20))
  .htmlLat('lat').htmlLng('lng')
  .htmlAltitude(0.02)
  .htmlElement(s => {
    const el = document.createElement('div');
    el.className = 'gmarker';
    el.textContent = s.city;
    el.addEventListener('click', () => select(s.n));
    s._el = el;
    return el;
  })
  .onPointClick(s => select(s.n));

// 지구 뒷면 라벨 가림: 지평선(cosθ = R/d) 기반
function updateMarkerVisibility(){
  const cam = world.camera().position;
  const camLen = Math.hypot(cam.x, cam.y, cam.z) || 1;
  const horizon = (world.getGlobeRadius() / camLen) * 0.97;
  STOPS.forEach(s => {
    if (!s._el) return;
    const p = world.getCoords(s.lat, s.lng, 0.02);
    const pLen = Math.hypot(p.x, p.y, p.z) || 1;
    const dot = (p.x*cam.x + p.y*cam.y + p.z*cam.z) / (pLen * camLen);
    const visible = dot > horizon;
    s._el.style.opacity = visible ? 1 : 0;
    s._el.style.pointerEvents = visible ? 'auto' : 'none';
  });
}
world.controls().addEventListener('change', updateMarkerVisibility);
setInterval(updateMarkerVisibility, 300);

world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 0.55;
world.pointOfView({ lat: 45, lng: -100, altitude: 2.2 }, 0);
world.controls().addEventListener('start', () => { world.controls().autoRotate = false; });
let idleTimer;
document.getElementById('globe').addEventListener('pointerup', () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { world.controls().autoRotate = true; }, 12000);
});

// 우측 상세 드로어
const drawer = document.getElementById('drawer');
let current = 0;
function select(n){
  current = n;
  const s = STOPS[n];
  world.controls().autoRotate = false;
  world.pointOfView({ lat: s.lat, lng: s.lng - 18, altitude: 1.5 }, 1100); // 드로어에 안 가리게 살짝 왼쪽으로
  document.querySelectorAll('.stop').forEach(e => e.classList.remove('active'));
  const row = document.getElementById('stop-'+n);
  row.classList.add('active');
  row.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });

  document.getElementById('dDate').textContent = `2027–28 · ${s.date}`;
  document.getElementById('dCity').textContent = s.city;
  document.getElementById('dVia').textContent = s.via ? (s.via + (s.dur ? ' · 이동 ' + s.dur : '')) : '인천공항에서 출발';
  document.getElementById('dDesc').textContent = s.desc;

  const secStay = document.getElementById('secStay');
  if (s.stay){
    secStay.hidden = false;
    document.getElementById('dStayName').textContent = s.stay.name;
    document.getElementById('dStayPrice').textContent = s.stay.price;
    document.getElementById('dStayNote').textContent = s.stay.note;
    const lk = STAY_LINKS[n] || {};
    const linksEl = document.getElementById('dStayLinks');
    linksEl.innerHTML = '';
    if (lk.url){
      const a = document.createElement('a');
      a.href = lk.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = lk.url.includes('booking.com') ? '숙소 검색 ↗' : '예약·공식 사이트 ↗';
      linksEl.appendChild(a);
    }
    if (lk.map){
      const m = document.createElement('a');
      m.href = 'https://www.google.com/maps/search/' + encodeURIComponent(lk.map);
      m.target = '_blank'; m.rel = 'noopener'; m.className = 'map';
      m.textContent = '지도에서 보기 📍';
      linksEl.appendChild(m);
    }
  } else { secStay.hidden = true; }

  const todoEl = document.getElementById('dTodo');
  todoEl.innerHTML = '';
  (s.todo || []).forEach(t => { const li = document.createElement('li'); li.textContent = t; todoEl.appendChild(li); });
  document.getElementById('secTodo').hidden = !(s.todo && s.todo.length);

  const secTip = document.getElementById('secTip');
  if (s.tip){ secTip.hidden = false; document.getElementById('dTip').textContent = s.tip; }
  else { secTip.hidden = true; }

  document.getElementById('btnPrev').disabled = (n === 0);
  document.getElementById('btnNext').disabled = (n === STOPS.length - 1);
  drawer.classList.add('show');
}
document.getElementById('drawerClose').addEventListener('click', () => drawer.classList.remove('show'));
document.getElementById('btnPrev').addEventListener('click', () => { if (current > 0) select(current - 1); });
document.getElementById('btnNext').addEventListener('click', () => { if (current < STOPS.length - 1) select(current + 1); });
document.addEventListener('keydown', e => {
  if (!drawer.classList.contains('show')) return;
  if (e.key === 'ArrowRight') { if (current < STOPS.length - 1) select(current + 1); }
  if (e.key === 'ArrowLeft') { if (current > 0) select(current - 1); }
  if (e.key === 'Escape') drawer.classList.remove('show');
});

setTimeout(() => select(0), 600);
setTimeout(() => { world.controls().autoRotate = true; }, 4000);
window.addEventListener('resize', () => world.width(window.innerWidth).height(window.innerHeight));
</script>
</body>
